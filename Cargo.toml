[package]
name = "state-space-adventure"
version = "0.1.0"
edition = "2021"

[dependencies]
glam = { version = "*", features = ["serde"] }
itertools = "0.14.0"
mint = "0.5.9"
petgraph = { version = "0.8.2", features = ["serde", "serde-1"] }
rand = "0.9.2"
rayon = "1.11.0"
ron = "0.12.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_ron = "1.0.0"
tokio = { version = "*", features = ["rt", "tokio-macros", "sync"] }

[dependencies.stardust-xr-fusion]
git = "https://github.com/StardustXR/core.git"
branch = "binder"

[dependencies.stardust-xr-asteroids]
git = "https://github.com/StardustXR/asteroids.git"
branch = "binder"
